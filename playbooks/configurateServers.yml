---
- hosts: lxc
  become: true
  vars_prompt:
    - name: ansible_password
      prompt: "Введите SSH-пароль для ключа ~/.ssh/ansible"
      private: true

    - name: ansible_become_password
      prompt: "Введите sudo-пароль для роли суперпользователя (root)"
      private: true
  roles:
    - role: createAnsibleUser
    # - role: setServerName
    - role: setTimezone