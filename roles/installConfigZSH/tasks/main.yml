---
- name: Установка зависимостей (Linux)
  ansible.builtin.package:
    name:
      - zsh
      - git
      - unzip
      - fontconfig
    state: present
  become: true
  when: not is_macos

- name: Установка git (macOS)
  community.general.homebrew:
    name: git
    state: present
  become: false
  when: is_macos

- name: Download ohmyzsh
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: "{{ user_home }}/install.sh"
    mode: '0755'
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Install ohmyzsh
  ansible.builtin.command: "{{ user_home }}/install.sh"
  args:
    creates: "{{ user_home }}/.oh-my-zsh"
  environment:
    RUNZSH: "no"
    CHSH: "no"
    HOME: "{{ user_home }}"
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Install PowerLevel10K
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Download NerdFonts
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/FiraCode.zip"
    dest: "{{ user_home }}/FiraCode-{{ nerd_fonts_version }}.zip"
    mode: '0644'
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Create temp directory
  ansible.builtin.file:
    path: "{{ user_home }}/FiraCode"
    state: directory
    mode: '0755'
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Install font files
  ansible.builtin.unarchive:
    src: "{{ user_home }}/FiraCode-{{ nerd_fonts_version }}.zip"
    dest: "{{ user_home }}/FiraCode"
    remote_src: true
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"

- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ fonts_dir }}"
    state: directory
    mode: '0755'
  become: "{{ not is_macos }}"

- name: Move font files to fonts directory
  ansible.builtin.copy:
    src: "{{ user_home }}/FiraCode/"
    dest: "{{ fonts_dir }}/"
    remote_src: true
    mode: '0644'
    directory_mode: '0755'
  become: "{{ not is_macos }}"

- name: Update font cache
  ansible.builtin.command: fc-cache -f
  changed_when: false
  become: true
  when: not is_macos

- name: Set zsh as login shell
  ansible.builtin.user:
    name: "{{ user }}"
    shell: /bin/zsh
  become: true
  when: not is_macos

- name: Update .zshrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.zshrc"
    insertafter: EOF
    line: "source {{ user_home }}/.oh-my-zsh/custom/themes/powerlevel10k/powerlevel10k.zsh-theme"
    create: true
    mode: '0644'
  become: "{{ not is_macos }}"
  become_user: "{{ user }}"
