---
# tasks file for createAnsibleUser
- name: Create ansible user
  become: true
  ansible.builtin.user:
    name: "{{ userName }}"
    state: present
    shell: "/bin/bash"
    groups: sudo
    append: true

- name: Разрешить пользователю ansible использовать sudo без пароля
  become: true
  community.general.sudoers:
    name: "{{ userName }}"
    user: "{{ userName }}"
    commands: ALL
    nopassword: true
    
- name: Add ansible SSH .pub key
  become: true
  ansible.posix.authorized_key:
    user: "{{ userName }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/ansible.pub') }}"